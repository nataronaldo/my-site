<body>
    <div class="background-animation" id="background-animation"></div>

    <div class="container">
        <div class="header">
            <h1>Официальная система жалоб Telegram</h1>
            <p>Централизованная система для обработки нарушений правил сообщества</p>
        </div>

        <div class="content">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" placeholder="Введите имя пользователя без @" required />
            </div>

            <div class="form-group">
                <label>Выберите основания для жалобы</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="violation" value="spam" /> Спам и массовые рассылки</label>
                    <label><input type="checkbox" name="violation" value="threat" /> Угрозы и запугивание</label>
                    <label><input type="checkbox" name="violation" value="personal" /> Распространение личных данных</label>
                    <label><input type="checkbox" name="violation" value="fake" /> Поддельный аккаунт</label>
                    <label><input type="checkbox" name="violation" value="scam" /> Мошенничество</label>
                    <label><input type="checkbox" name="violation" value="illegal" /> Незаконный контент</label>
                    <label><input type="checkbox" name="violation" value="harmful" /> Вредоносное ПО</label>
                    <label><input type="checkbox" name="violation" value="violence" /> Пропаганда насилия</label>
                </div>
            </div>

            <div class="form-group">
                <label for="count">Количество жалоб для отправки</label>
                <select id="count">
                    <option value="10">10 жалоб (Стандартное рассмотрение)</option>
                    <option value="50">50 жалоб (Приоритетное рассмотрение)</option>
                    <option value="100" selected>100 жалоб (Быстрое рассмотрение)</option>
                    <option value="500">500 жалоб (Турбо режим)</option>
                    <option value="1000">1000 жалоб (Гарантированное удаление)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="details">Опишите нарушение</label>
                <textarea id="details" rows="4" placeholder="Предоставьте детали нарушения для более эффективного рассмотрения..."></textarea>
            </div>

            <button class="submit-btn" onclick="showNotification()">Отправить жалобы</button>

            <div id="notification" class="notification">
                Жалобы успешно отправлены. Аккаунт будет рассмотрен модераторами в ближайшее время.
            </div>

            <div class="support-section">
                <button class="support-btn" onclick="openSupportModal()">Связаться с поддержкой</button>
            </div>

            <!-- Чат с ИИ -->
            <div class="chat-container" id="chatContainer">
                <div class="chat-message" id="chatMessages"></div>
            </div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Введите ваше сообщение..." />
                <button onclick="sendMessage()">Отправить</button>
            </div>

    <div id="deathModal" class="modal">
        <div class="modal-content">
            <p>ЕГО СМЕРТЬ УЖЕ БЛИЗКО</p>
            <button class="close-button" onclick="closeModal()">ПОНЯТНО</button>
        </div>
    </div>

    <div id="supportModal" class="modal">
        <div class="modal-content">
            <p>Как мы можем помочь вам?</p>
            <button class="close-button" onclick="closeSupportModal()">Закрыть</button>
        </div>
    </div>

    <script>
      // Генерация случайного имени для ИИ
      const aiNames = ["Алиса", "Ботан", "Сириус", "Элли", "Котик"];
      const aiName = aiNames[Math.floor(Math.random() * aiNames.length)];

      function showNotification() {
        const username = document.getElementById("username").value;
        if (!username) {
          alert("Пожалуйста, введите имя пользователя!");
          return;
        }

        const violations = document.querySelectorAll('input[name="violation"]:checked');
        if (violations.length === 0) {
          alert("Выберите хотя бы один тип нарушения!");
          return;
        }

        document.getElementById("deathModal").style.display = "block";
        document.getElementById("notification").style.display = "block";
      }

      function closeModal() {
        document.getElementById("deathModal").style.display = "none";
      }

      function openSupportModal() {
        document.getElementById("supportModal").style.display = "block";
      }

      function closeSupportModal() {
        document.getElementById("supportModal").style.display = "none";
      }

      function sendMessage() {
        const input = document.getElementById("chatInput");
        const message = input.value.trim();
        if (message) {
          // Отображение сообщения пользователя
          const chatMessages = document.getElementById("chatMessages");
          chatMessages.innerHTML += `<div class="chat-message">Вы: ${message}</div>`;
          input.value = "";

          // Ответ ИИ (разнообразные ответы)
          const responses = [
            `${aiName}: Спасибо за ваше сообщение! Мы свяжемся с вами.`,
            `${aiName}: Ваше сообщение получено, ожидайте ответа.`,
            `${aiName}: Мы ценим ваше обращение!`,
            `${aiName}: Как мы можем помочь вам?`,
            `${aiName}: Ваш вопрос важен для нас!`,
          ];
          const response = responses[Math.floor(Math.random() * responses.length)];

          setTimeout(() => {
            chatMessages.innerHTML += `<div class="chat-message">${response}</div>`;
            chatMessages.scrollTop = chatMessages.scrollHeight; // Прокрутка вниз
          }, 1000);
        }
      }
    </script>
